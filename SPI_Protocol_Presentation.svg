<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Basys3 SPI 센서 통신 프로토콜</title>
  <desc id="desc">SPI Mode 0, 1MHz, MSB First 방식으로 Master가 주소 8비트를 보내고 Slave가 다음 8클록 동안 센서 응답을 반환하는 프로토콜</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#0f172a}
      .title{font-size:46px;font-weight:700}.subtitle{font-size:22px;fill:#475569}
      .chip{font-size:19px;font-weight:700}.endpoint{font-size:28px;font-weight:700;fill:#fff}
      .endpoint-sub{font-size:18px;fill:#dbeafe}.lane{font-size:20px;font-weight:700}
      .phase{font-size:22px;font-weight:700}.phase-sub{font-size:18px}
      .small{font-size:17px;fill:#475569}.clock{font-size:15px;fill:#64748b}
      .addr{font-size:26px;font-weight:700}.map-title{font-size:21px;font-weight:700}.map-sub{font-size:17px;fill:#475569}
      .footer{font-size:21px;font-weight:700;fill:#ffffff}.footer-blue{font-size:21px;font-weight:700;fill:#93c5fd}
      .footer-teal{font-size:21px;font-weight:700;fill:#5eead4}.footer-muted{font-size:18px;fill:#cbd5e1}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text class="title" x="90" y="72">Basys3 SPI 센서 통신 프로토콜</text>
  <text class="subtitle" x="90" y="108">주소 기반 2-Byte Frame · 센서와 연결되지 않아도 Self-Test 가능</text>

  <g transform="translate(1260 47)">
    <rect x="0" y="0" width="135" height="42" rx="21" fill="#dbeafe"/><text class="chip" x="67.5" y="28" text-anchor="middle" fill="#1d4ed8">MODE 0</text>
    <rect x="147" y="0" width="135" height="42" rx="21" fill="#dcfce7"/><text class="chip" x="214.5" y="28" text-anchor="middle" fill="#166534">1 MHz</text>
    <rect x="294" y="0" width="170" height="42" rx="21" fill="#fef3c7"/><text class="chip" x="379" y="28" text-anchor="middle" fill="#92400e">MSB FIRST</text>
    <rect x="476" y="0" width="175" height="42" rx="21" fill="#ede9fe"/><text class="chip" x="563.5" y="28" text-anchor="middle" fill="#6d28d9">16 CLOCKS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="140" width="500" height="105" rx="18" fill="#1d4ed8"/>
    <text class="endpoint" x="125" y="184">MASTER BASYS3</text>
    <text class="endpoint-sub" x="125" y="218">주소 선택 · SCK/CS/MOSI 생성 · MISO 수신</text>
    <rect x="1330" y="140" width="500" height="105" rx="18" fill="#0f766e"/>
    <text class="endpoint" x="1365" y="184">SLAVE BASYS3</text>
    <text class="endpoint-sub" x="1365" y="218">주소 디코드 · 센서 레지스터 · MISO 응답</text>
  </g>

  <line x1="610" y1="160" x2="1310" y2="160" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="small" x="960" y="151" text-anchor="middle">SCK · CS_n · MOSI</text>
  <line x1="1310" y1="220" x2="610" y2="220" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text class="small" x="960" y="212" text-anchor="middle">MISO</text>

  <rect x="90" y="285" width="1740" height="405" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text class="phase" x="130" y="325">한 번의 SPI Transaction</text>
  <text class="small" x="455" y="325">CS_n LOW 동안 정확히 16개의 SCK 사용</text>

  <text class="lane" x="135" y="379">CS_n</text>
  <path d="M300 350H400V390H1680V350H1760" fill="none" stroke="#0f172a" stroke-width="5"/>
  <text class="small" x="350" y="343" text-anchor="middle">HIGH</text><text class="small" x="1040" y="383" text-anchor="middle">LOW — Frame Active</text><text class="small" x="1720" y="343" text-anchor="middle">HIGH</text>

  <text class="lane" x="135" y="475">SCK</text>
  <path d="M300 480H400 H420V440H460V480H500V440H540V480H580V440H620V480H660V440H700V480H740V440H780V480H820V440H860V480H900V440H940V480H980V440H1020V480H1060V440H1100V480H1140V440H1180V480H1220V440H1260V480H1300V440H1340V480H1380V440H1420V480H1460V440H1500V480H1540V440H1580V480H1620V440H1660V480H1760" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <g text-anchor="middle" class="clock">
    <text x="440" y="430">1</text><text x="520" y="430">2</text><text x="600" y="430">3</text><text x="680" y="430">4</text>
    <text x="760" y="430">5</text><text x="840" y="430">6</text><text x="920" y="430">7</text><text x="1000" y="430">8</text>
    <text x="1080" y="430">9</text><text x="1160" y="430">10</text><text x="1240" y="430">11</text><text x="1320" y="430">12</text>
    <text x="1400" y="430">13</text><text x="1480" y="430">14</text><text x="1560" y="430">15</text><text x="1640" y="430">16</text>
  </g>

  <line x1="1040" y1="340" x2="1040" y2="665" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/>

  <text class="lane" x="135" y="555">MOSI</text>
  <rect x="400" y="515" width="640" height="62" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="phase" x="720" y="542" text-anchor="middle" fill="#1d4ed8">ADDRESS [7:0]</text>
  <text class="phase-sub" x="720" y="565" text-anchor="middle" fill="#1e40af">Master → Slave</text>
  <rect x="1040" y="515" width="640" height="62" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text class="phase" x="1360" y="542" text-anchor="middle">0x00 DUMMY</text>
  <text class="phase-sub" x="1360" y="565" text-anchor="middle">응답 클록 생성용</text>

  <text class="lane" x="135" y="635">MISO</text>
  <rect x="400" y="595" width="640" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text class="phase" x="720" y="622" text-anchor="middle" fill="#64748b">IGNORE</text>
  <text class="phase-sub" x="720" y="645" text-anchor="middle" fill="#64748b">첫 번째 MISO 바이트는 사용하지 않음</text>
  <rect x="1040" y="595" width="640" height="62" rx="10" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
  <text class="phase" x="1360" y="622" text-anchor="middle" fill="#0f766e">RESPONSE DATA [7:0]</text>
  <text class="phase-sub" x="1360" y="645" text-anchor="middle" fill="#115e59">Slave → Master · 상승 에지에서 샘플</text>

  <text class="phase" x="90" y="750">주소 및 응답</text>
  <text class="small" x="250" y="750">주소마다 CS_n을 HIGH로 복귀한 후 다음 Frame 시작</text>

  <g transform="translate(90 775)">
    <g><rect width="270" height="120" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/><text class="addr" x="24" y="42" fill="#1d4ed8">0x00</text><text class="map-title" x="24" y="75">온도 정수부</text><text class="map-sub" x="24" y="101">Temperature integer</text></g>
    <g transform="translate(288 0)"><rect width="270" height="120" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/><text class="addr" x="24" y="42" fill="#1d4ed8">0x01</text><text class="map-title" x="24" y="75">습도 정수부</text><text class="map-sub" x="24" y="101">Humidity integer</text></g>
    <g transform="translate(576 0)"><rect width="270" height="120" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/><text class="addr" x="24" y="42" fill="#6d28d9">0x02</text><text class="map-title" x="24" y="75">거리 LSB</text><text class="map-sub" x="24" y="101">Distance bits [7:0]</text></g>
    <g transform="translate(864 0)"><rect width="270" height="120" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/><text class="addr" x="24" y="42" fill="#6d28d9">0x03</text><text class="map-title" x="24" y="75">거리 MSB</text><text class="map-sub" x="24" y="101">Distance bits [15:8]</text></g>
    <g transform="translate(1152 0)"><rect width="270" height="120" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text class="addr" x="24" y="42" fill="#15803d">0xF0</text><text class="map-title" x="24" y="75">Self-Test</text><text class="map-sub" x="24" y="101">Response 0xA5</text></g>
    <g transform="translate(1440 0)"><rect width="270" height="120" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text class="addr" x="24" y="42" fill="#15803d">0xF1</text><text class="map-title" x="24" y="75">Self-Test</text><text class="map-sub" x="24" y="101">Response 0x5A</text></g>
  </g>

  <rect x="90" y="930" width="1740" height="92" rx="16" fill="#0f172a"/>
  <text class="footer" x="125" y="968">테스트 프레임</text>
  <text class="footer-blue" x="340" y="968">MOSI: F0 00</text>
  <text class="footer" x="560" y="968">→</text>
  <text class="footer-teal" x="610" y="968">MISO 두 번째 바이트: A5</text>
  <text class="footer-blue" x="1040" y="968">MOSI: F1 00</text>
  <text class="footer" x="1260" y="968">→</text>
  <text class="footer-teal" x="1310" y="968">MISO 두 번째 바이트: 5A</text>
  <text class="footer-muted" x="125" y="1004">CS setup/hold/high ≥ 100 ns · CS_n HIGH에서 MISO Hi-Z · MOSI Echo 방식 아님 · Master/Slave 공통 GND 필수</text>
</svg>
